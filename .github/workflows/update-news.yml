name: Infos portefeuille (lun-ven 7h00 et 18h30, Prague)

# À placer dans le repo sous : .github/workflows/update-news.yml
# Fichiers nécessaires à la racine du repo : news_prompt.md, update_news_gsheet.py
# Secrets du repo (Settings → Secrets and variables → Actions) :
#   CLAUDE_CODE_OAUTH_TOKEN  jeton de l'abonnement Claude (claude setup-token) — pas de frais API
#   GOOGLE_SERVICE_ACCOUNT   déjà présent (utilisé par update-prices.yml)
#
# Déclencheurs :
#   1) repository_dispatch (PRINCIPAL, à l'heure pile) : cron-job.org à 7h00 et 18h30 heure de Prague,
#      event_type "news_morning" / "news_evening" (même principe que update-prices.yml).
#   2) schedule (SECOURS) : GitHub retarde souvent ses crons de plusieurs heures. Plusieurs crons UTC ;
#      `update_news_gsheet.py --should-run` ne lance l'édition que si celle du créneau en cours
#      (matin dès 7h00, soir dès 18h30, Prague) n'a pas encore été faite → jamais de doublon.
#   3) workflow_dispatch : lancement manuel (bouton « Run workflow »), toujours exécuté.

on:
  repository_dispatch:
    types: [news_morning, news_evening]
  schedule:
    - cron: '5 5 * * 1-5'     # ≈ 7h05 Prague (été) / 6h05 (hiver → rien à faire)
    - cron: '5 6 * * 1-5'     # ≈ 7h05 Prague (hiver) / 8h05 (été, rattrapage)
    - cron: '5 8 * * 1-5'     # rattrapage matin
    - cron: '35 16 * * 1-5'   # ≈ 18h35 Prague (été) / 17h35 (hiver → rien à faire)
    - cron: '35 17 * * 1-5'   # ≈ 18h35 Prague (hiver) / 19h35 (été, rattrapage)
    - cron: '35 19 * * 1-5'   # rattrapage soir
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install google-auth google-api-python-client

      - name: Édition à faire ?
        id: guard
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          echo "Prague : $(TZ=Europe/Prague date '+%a %d/%m %H:%M') — déclencheur ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then P=true; else P=$(python update_news_gsheet.py --should-run); fi
          echo "proceed=$P" >> "$GITHUB_OUTPUT"; echo "proceed=$P"

      - name: Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        if: steps.guard.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Résumé des actualités (Claude Code, abonnement) → onglet News
        if: steps.guard.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          TZ: Europe/Prague
        run: |
          claude -p "$(cat news_prompt.md)" \
            --allowedTools "WebSearch" "WebFetch" "Read" "Write" "Bash(python update_news_gsheet.py:*)" "Bash(date:*)" \
            --max-turns 200

      - name: Vérification
        if: steps.guard.outputs.proceed == 'true'
        run: test -s news_portefeuille.json && python -c "import json;d=json.load(open('news_portefeuille.json',encoding='utf-8'));print(len(d['stocks']),'titres')"
